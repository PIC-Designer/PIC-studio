name: Build catalogue and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIC_LIBRARY_TOKEN: ${{ secrets.PIC_LIBRARY_TOKEN }}
    steps:
      - name: Checkout PIC Studio
        uses: actions/checkout@v4

      - name: Checkout private PIC library
        if: ${{ env.PIC_LIBRARY_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: PIC-Designer/PIC_library
          token: ${{ env.PIC_LIBRARY_TOKEN }}
          path: .reference-library
          fetch-depth: 1

      - name: Build design catalogue
        if: ${{ env.PIC_LIBRARY_TOKEN != '' }}
        run: python scripts/build_catalog.py --source .reference-library/pdk --output public/catalog.json

      - name: Build test-chip catalogue
        if: ${{ env.PIC_LIBRARY_TOKEN != '' }}
        run: python scripts/build_chip_catalog.py --source .reference-library --registry data/chip_uid_registry.json --output public/chip_catalog.json

      - name: Enforce OAS-only layout artifacts
        run: python scripts/check_layout_formats.py public

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
