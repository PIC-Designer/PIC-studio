name: Build catalogue and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PIC Studio
        uses: actions/checkout@v4

      - name: Checkout private PIC library
        uses: actions/checkout@v4
        with:
          repository: PIC-Designer/PIC_library
          token: ${{ secrets.PIC_LIBRARY_TOKEN }}
          path: .reference-library
          fetch-depth: 1

      - name: Build design catalogue
        run: python scripts/build_catalog.py --source .reference-library/pdk --output public/catalog.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
